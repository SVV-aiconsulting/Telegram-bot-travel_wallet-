services:
  bot:
    image: ghcr.io/svv-aiconsulting/travel-wallet-bot:latest
    pull_policy: always
    container_name: travel-wallet-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/travel_wallet.sqlite3
    volumes:
      - travel_wallet_data:/data

volumes:
  travel_wallet_data:
